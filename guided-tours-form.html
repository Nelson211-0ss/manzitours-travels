<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <title>Guided Tours Request – Honzi Tours &amp; Travel</title>
  <meta name="description" content="Submit your guided tour request. We'll arrange expert local guides for your chosen experiences.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Google Sans Flex', 'system-ui', 'sans-serif'], display: ['Fraunces', 'Georgia', 'serif'] }, colors: { gold: { DEFAULT: '#C1A061', light: '#C6B289', dark: '#A68B4B' }, deepBlue: { DEFAULT: '#0f172a', light: '#1e3a5f', dark: '#0c1929' }, sunset: { DEFAULT: '#e07c54', light: '#f5a962', dark: '#c9613d' } } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/scroll-animations.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .font-display { font-family: 'Fraunces', Georgia, serif; }
    .font-sans { font-family: 'Google Sans Flex', system-ui, sans-serif; }
  </style>
</head>
<body class="font-sans text-gold-light antialiased bg-black">
  <script>document.documentElement.classList.add('js-reveal');</script>
  <div id="header-placeholder">
    <div class="h-16 md:h-20 bg-black border-b border-gold/20 flex items-center justify-center"><span class="text-gold-light">Loading…</span></div>
  </div>

  <main class="relative min-h-[calc(100dvh-4rem)] overflow-hidden pt-24 pb-16 md:min-h-[calc(100dvh-5rem)] md:pt-28 md:pb-20">
    <div class="pointer-events-none fixed inset-0 -z-10 bg-gradient-to-b from-deepBlue via-black to-deepBlue"></div>
    <div class="pointer-events-none fixed inset-0 -z-10 bg-[url('https://images.unsplash.com/photo-1489392191049-fc10c97e64b6?w=1920&q=80')] bg-cover bg-center opacity-25"></div>
    <div class="pointer-events-none fixed inset-0 -z-10 bg-black/65"></div>

    <div class="relative z-10 mx-auto max-w-xl px-4 sm:px-6">
      <div class="mb-8 text-center" data-reveal="soft">
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gold/90">Guided</p>
        <h1 class="font-display mt-2 text-2xl font-bold tracking-tight text-white sm:text-3xl">Guided tours request</h1>
        <p class="mt-4 text-sm leading-relaxed text-gold-light/90">Choose your interests and dates—we’ll plan the rest.</p>
      </div>

      <form id="guided-form-el" class="rounded-3xl border border-white/10 bg-white/[0.04] p-6 shadow-2xl shadow-black/40 backdrop-blur-xl md:p-8" data-reveal="lift" data-reveal-delay="120">
        <div class="space-y-6">
          <div>
            <label for="name" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Full name <span class="text-rose-400/90">*</span></label>
            <input type="text" id="name" name="name" required class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white placeholder:text-white/35 transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20" placeholder="Lead guest" autocomplete="name">
          </div>

          <div class="grid gap-5 sm:grid-cols-2">
            <div>
              <label for="phone" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Phone <span class="text-rose-400/90">*</span></label>
              <input type="tel" id="phone" name="phone" required class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white placeholder:text-white/35 transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20" placeholder="+971 …" autocomplete="tel">
            </div>
            <div>
              <label for="email" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Email <span class="text-rose-400/90">*</span></label>
              <input type="email" id="email" name="email" required class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white placeholder:text-white/35 transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>

          <div>
            <label for="country" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Nationality <span class="text-rose-400/90">*</span></label>
            <select id="country" name="country" required class="form-select-chevron w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20">
              <option value="">Choose nationality</option>
            </select>
          </div>

          <div class="border-t border-white/10 pt-6">
            <p class="mb-4 font-display text-sm font-semibold text-white/95">Trip &amp; group</p>
            <div class="space-y-5">
              <div>
                <label for="passport-type" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Passport type</label>
                <select id="passport-type" name="passportType" class="form-select-chevron w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20">
                  <option value="">Select type</option>
                  <option value="Ordinary">Ordinary</option>
                  <option value="Official">Official</option>
                  <option value="Diplomatic">Diplomatic</option>
                </select>
              </div>

              <div class="grid gap-5 sm:grid-cols-2">
                <div>
                  <label for="days" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Number of days</label>
                  <input type="number" id="days" name="days" min="1" class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white placeholder:text-white/35 transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20" placeholder="e.g. 7">
                </div>
                <div>
                  <label for="people" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Number of people</label>
                  <input type="number" id="people" name="people" min="1" class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white placeholder:text-white/35 transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20" placeholder="e.g. 2">
                </div>
              </div>

              <div>
                <p class="mb-3 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Tour interests <span class="font-normal normal-case text-gold-light/60">(select any)</span></p>
                <div class="max-h-[min(22rem,50vh)] space-y-2 overflow-y-auto rounded-2xl border border-white/10 bg-black/40 p-3 pr-2">
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Dubai City Tour (City Drive, Dubai Mall and Burj Khalifa Views)" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Dubai City Tour (City Drive, Dubai Mall and Burj Khalifa Views)</span>
                  </label>
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Abu Dhabi City Tour (Beaches And City)" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Abu Dhabi City Tour (Beaches And City)</span>
                  </label>
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Dubai Frame Tour" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Dubai Frame Tour</span>
                  </label>
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Desert Safari and Sand Bashing" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Desert Safari and Sand Bashing</span>
                  </label>
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Cultural & Heritage Tours" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Cultural &amp; Heritage Tours</span>
                  </label>
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Miracle Gardens and Theme Parks" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Miracle Gardens and Theme Parks</span>
                  </label>
                  <label class="flex cursor-pointer gap-3 rounded-xl border border-transparent bg-black/30 px-3 py-2.5 transition hover:border-white/10 has-[:checked]:border-gold/40 has-[:checked]:bg-gold/10">
                    <input type="checkbox" name="interest" value="Marina Yacht Experiences" class="mt-0.5 h-4 w-4 shrink-0 rounded border-white/25 bg-black text-gold focus:ring-gold/40">
                    <span class="text-sm leading-snug text-gold-light/95">Marina Yacht Experiences</span>
                  </label>
                </div>
              </div>

              <div class="grid gap-5 sm:grid-cols-2">
                <div>
                  <label for="travel-date" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Expected travel</label>
                  <input type="date" id="travel-date" name="travelDate" class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20 [color-scheme:dark]">
                </div>
                <div>
                  <label for="departure-date" class="mb-2 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Departure</label>
                  <input type="date" id="departure-date" name="departureDate" class="w-full rounded-xl border border-white/10 bg-black/50 px-4 py-3.5 text-[15px] text-white transition focus:border-gold/50 focus:outline-none focus:ring-2 focus:ring-gold/20 [color-scheme:dark]">
                </div>
              </div>

              <div>
                <p class="mb-3 block text-xs font-semibold uppercase tracking-wider text-gold-light/95">Airport pickup &amp; drop-off</p>
                <div class="flex flex-wrap gap-2">
                  <label class="flex min-w-[7rem] flex-1 cursor-pointer">
                    <input type="radio" name="airportPickup" value="YES" class="peer sr-only">
                    <span class="flex w-full items-center justify-center rounded-xl border border-white/10 bg-black/40 px-4 py-3 text-center text-sm font-medium text-white/90 transition peer-checked:border-gold/60 peer-checked:bg-gold/15 peer-checked:text-gold">Yes</span>
                  </label>
                  <label class="flex min-w-[7rem] flex-1 cursor-pointer">
                    <input type="radio" name="airportPickup" value="NO" checked class="peer sr-only">
                    <span class="flex w-full items-center justify-center rounded-xl border border-white/10 bg-black/40 px-4 py-3 text-center text-sm font-medium text-white/90 transition peer-checked:border-gold/60 peer-checked:bg-gold/15 peer-checked:text-gold">No</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-8">
          <button type="submit" id="submit-btn" class="flex w-full items-center justify-center gap-2 rounded-full bg-gold py-4 text-base font-semibold text-black shadow-lg shadow-gold/20 transition hover:bg-gold-dark hover:text-white disabled:opacity-60">
            <i data-feather="send" class="h-5 w-5"></i>
            Submit request
          </button>
        </div>
      </form>

      <p class="mt-6 text-center text-xs text-gold-light/60"><a href="guided-destinations.html" class="text-gold/80 underline-offset-2 hover:text-gold hover:underline">← Back to guided destinations</a></p>
    </div>
  </main>

  <div id="footer-placeholder">
    <div class="h-24 bg-black border-t border-gold/20 flex items-center justify-center"><span class="text-gold-light">Loading…</span></div>
  </div>

  <script src="https://unpkg.com/feather-icons"></script>
  <script src="js/load-components.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/form-submit.js"></script>
  <script>
    (function() {
      function populateCountries() {
        var select = document.getElementById('country');
        if (!select) return;
        NATIONALITIES.forEach(function(c) {
          var opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      }

      function getFormData() {
        var form = document.getElementById('guided-form-el');
        var fd = new FormData(form);
        var airportPickup = form.querySelector('input[name="airportPickup"]:checked');
        var interests = form.querySelectorAll('input[name="interest"]:checked');
        var interestList = Array.from(interests).map(function(cb) { return cb.value; }).join(', ');
        return {
          name: fd.get('name') || '',
          phone: fd.get('phone') || '',
          email: fd.get('email') || '',
          country: fd.get('country') || '',
          passportType: fd.get('passportType') || '',
          days: fd.get('days') || '',
          people: fd.get('people') || '',
          interest: interestList || '',
          travelDate: fd.get('travelDate') || '',
          departureDate: fd.get('departureDate') || '',
          airportPickup: airportPickup ? airportPickup.value : 'NO'
        };
      }

      function formatMessage(data) {
        return [
          '*Guided Tours Request*',
          '',
          'Name: ' + data.name,
          'Phone: ' + data.phone,
          'Email: ' + data.email,
          'Nationality: ' + data.country,
          'Passport Type: ' + data.passportType,
          'Number of Days: ' + data.days,
          'Number of People: ' + data.people,
          'Guided Tour Interests: ' + (data.interest || 'None selected'),
          'Expected Travel Date: ' + data.travelDate,
          'Date of Departure: ' + data.departureDate,
          'Airport Pickup & Drop: ' + data.airportPickup
        ].join('\n');
      }

      function generatePDF(data) {
        var jsPDF = window.jspdf.jsPDF;
        var doc = new jsPDF();
        var y = 20;

        doc.setFontSize(18);
        doc.setTextColor(193, 160, 97);
        doc.text('Guided Tours Request', 20, y);
        y += 15;

        doc.setFontSize(11);
        doc.setTextColor(80, 80, 80);
        var lines = [
          ['Name:', data.name],
          ['Phone Number:', data.phone],
          ['Email Address:', data.email],
          ['Nationality:', data.country],
          ['Passport Type:', data.passportType],
          ['Number of Days:', data.days],
          ['Number of People:', data.people],
          ['Guided Tour Interests:', data.interest || 'None selected'],
          ['Expected Travel Date:', data.travelDate],
          ['Date of Departure:', data.departureDate],
          ['Airport Pickup & Drop:', data.airportPickup]
        ];
        lines.forEach(function(line) {
          doc.setFont(undefined, 'bold');
          doc.text(line[0], 20, y);
          doc.setFont(undefined, 'normal');
          var val = line[1] || '-';
          var split = doc.splitTextToSize(val, 120);
          doc.text(split, 70, y);
          y += split.length * 6 + 2;
        });

        return doc;
      }

      var form = document.getElementById('guided-form-el');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submit-btn');
        var origHTML = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="animate-pulse">Sending…</span>';

        var data = getFormData();
        var msg = formatMessage(data);
        var pdfBlob = null;
        var fileName = 'Guided-Tours-Request-' + (data.name || 'form').replace(/\s+/g, '-') + '.pdf';
        try {
          pdfBlob = generatePDF(data).output('blob');
        } catch (err) {
          console.warn('PDF generation failed, sending without attachment:', err);
        }

        HonziForm.submit({
          title: 'Guided Tours Request',
          data: data,
          message: msg,
          pdf: pdfBlob,
          fileName: fileName,
          form: form,
          button: btn,
          buttonHTML: origHTML
        });
      });

      populateCountries();
    })();
  </script>
</body>
</html>
